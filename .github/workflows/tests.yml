# The tests, as the gate in front of every publish (0.271.0) and every merge
# (2026-11-02). The Android and iOS workflows and the Pages deploy call this and
# wait on it, so a red test stops the APK, the IPA and the web app alike; and
# it runs on every pull request, where its last job, "Tests", is the one check
# main's ruleset requires before a merge (CONTRIBUTING.md). A pull request
# runs only the browser suites its files need (test/browser/affected.js and
# areas.json; Markdown alone needs none). Everything else that calls this,
# main's deploy, a release's builds and a hand run, runs every suite, so
# nothing ships on the smaller set.
name: Tests

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Which browser suites?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            SUITES=$(git diff --name-only "$BASE" HEAD | node test/browser/affected.js)
          else
            SUITES=all
          fi
          echo "Browser suites: $SUITES"
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-all.js

  # The browser suites one after another take most of half an hour, so they
  # run as eight shards side by side (a public repo's minutes are free). Playwright isn't a dependency of the
  # project (test/browser/README.md); it's installed here without saving.
  # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 can't
  # install Chromium on (2026-10-27). Move it on once Playwright supports it.
  browser:
    needs: scope
    if: needs.scope.outputs.suites != 'none'
    runs-on: ubuntu-24.04
    # A shard takes about four minutes. On 2026-11-14 one hung in the apt
    # step of the Chromium install for six hours, GitHub's own limit, and
    # held its PR's check that long; this fails it fast so a re-run can go.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser suites, shard ${{ matrix.shard }} of 8
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SUITES: ${{ needs.scope.outputs.suites }}
        run: |
          if [ "$SUITES" = all ]; then
            node test/browser/run-all.js --shard=${{ matrix.shard }}/8
          else
            node test/browser/run-all.js --shard=${{ matrix.shard }}/8 --only="$SUITES"
          fi

  # One check for the ruleset to require: green when the unit tests passed
  # and the browser shards passed or were skipped (no suite needed).
  tests:
    name: Tests
    needs: [scope, unit, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "scope: $SCOPE, unit: $UNIT, browser: $BROWSER"
          [ "$SCOPE" = success ] && [ "$UNIT" = success ] && { [ "$BROWSER" = success ] || [ "$BROWSER" = skipped ]; }
