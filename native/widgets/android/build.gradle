// LifeLog's home-screen widgets, as a local Capacitor plugin so android/ can
// stay generated. Modelled on @capacitor/app-launcher's own build file.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "io.github.danielnoam.lifelog.widgets"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':capacitor-android')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // The background refresh's periodic job (HeadlessRefresh).
    implementation "androidx.work:work-runtime:2.10.1"
    // Google Drive backups' sign-in (DrivePlugin), as in Waypage.
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    // Health Connect: steps, workouts and sleep for linked habits
    // (HealthPlugin, HealthReader). Needs minSdk 26 (tools/android-manifest.js).
    implementation "androidx.health.connect:connect-client:1.1.0"
    // HealthReader calls the client's suspend functions with runBlocking.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // connect-client swaps Guava's ListenableFuture for the empty
    // "9999.0-empty-to-avoid-conflict-with-guava" jar, which takes it away
    // from WorkManager's Worker (HeadlessRefresh); full Guava puts it back.
    implementation "com.google.guava:guava:33.3.1-android"
    testImplementation "junit:junit:$junitVersion"
    // android.jar's org.json is stubs under a unit test; this is the real thing.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
